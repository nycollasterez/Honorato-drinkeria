<!doctype html>
<html lang="pt-BR" style="background-color: #000000; color: #ffffff;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Honorato Drinkeria · Cardápio & Gestão</title>
    <meta name="description" content="Sistema integrado de cardápio digital, comandas numeradas, caixa PDV e estoque para bar e drinkeria em estética preto e branco." />
    <meta property="og:title" content="Honorato Drinkeria · Cardápio & Gestão" />
    <meta property="og:description" content="Sistema integrado de cardápio digital, comandas numeradas, caixa PDV e estoque para bar e drinkeria em estética preto e branco." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black text-neutral-100 antialiased selection:bg-white selection:text-black" style="background-color: #000000; color: #ffffff; margin: 0; padding: 0;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <div style="border: 1px solid #262626; padding: 32px 40px; max-width: 380px; width: 100%; background: #0a0a0a;">
          <h1 style="font-size: 20px; font-weight: 700; letter-spacing: 4px; margin: 0 0 6px 0; color: #fff; font-family: 'Cinzel', serif;">HONORATO</h1>
          <p style="font-size: 11px; color: #888; margin: 0 0 24px 0; letter-spacing: 2px; text-transform: uppercase;">Drinkeria & Bar</p>
          <div style="display: inline-block; width: 24px; height: 24px; border: 2px solid #333; border-top-color: #fff; border-radius: 50%; animation: honorato-spin 0.7s linear infinite;"></div>
          <p style="font-size: 11px; color: #666; margin-top: 18px; margin-bottom: 0; letter-spacing: 1px;">CARREGANDO SISTEMA...</p>
        </div>
      </div>
      <style>
        @keyframes honorato-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
